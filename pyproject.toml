[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-lab"
version = "0.1.0"
description = "Simulation physique et contrôle de qubits supraconducteurs (Fluxonium, Kerr-Cat, QEC)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
